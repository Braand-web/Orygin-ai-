[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "orygin-ai-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Orygin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Orygin" }]
dependencies = [
  "pydantic>=2.12,<3",
  "orygin-ai-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/Braand-web/Orygin-ai-"
Documentation = "https://github.com/Braand-web/Orygin-ai-/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/Braand-web/Orygin-ai-/issues"
Source = "https://github.com/Braand-web/Orygin-ai-"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/orygin_harness"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
orygin-ai-runtime-bin = { path = "../sdk-runtime", editable = true }
