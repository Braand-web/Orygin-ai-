[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "orygin-ai-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Orygin runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Orygin" }]

[project.urls]
Homepage = "https://github.com/Braand-web/Orygin-ai-"
Documentation = "https://github.com/Braand-web/Orygin-ai-/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/Braand-web/Orygin-ai-/issues"
Source = "https://github.com/Braand-web/Orygin-ai-"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/orygin_harness_runtime/runtime/dsh-jsonrpc-agent-*"]
exclude = ["src/orygin_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/orygin_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
