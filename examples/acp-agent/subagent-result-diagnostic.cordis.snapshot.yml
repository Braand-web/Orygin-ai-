# Keyless twin of subagent-result-diagnostic.cordis.yml: keep the same test
# provider/tool and replace only the external model adapter.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: llm-replay
            name: '@orygin-ai/dsh-llm-replay'
            config:
              providers:
                - id: orygin-official
                  name: Orygin
                  models:
                    - id: orygin-v4-flash
                    - id: orygin-v4-pro
          - id: subagent-result-diagnostic
            name: './tests/fixtures/subagent-result-diagnostic.ts'
          - id: tool-subagent-codex
            name: '@orygin-ai/dsh-tool-subagent'
            config:
              provider: snapshot-diagnostic
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
      - id: llm-orygin
        name: '@orygin-ai/dsh-llm-orygin'
        disabled: true
