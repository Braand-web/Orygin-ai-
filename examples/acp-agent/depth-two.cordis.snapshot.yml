# Keyless counterpart to depth-two.cordis.yml: apply the depth patch and replace
# the live adapter with per-session replay.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-orygin
        name: '@orygin-ai/dsh-llm-orygin'
        disabled: true
      - id: sandbox
        name: '@orygin-ai/dsh-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - id: tool-subagent
        name: '@orygin-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: continuable
          maxDepth: 2
      # Re-pin the recorded model: cordis.yml ships orygin-v4-pro, but this
      # scenario's corpus was captured on flash. A config patch replaces the
      # whole app config, so the base fields are restated verbatim.
      - id: acp-agent
        name: '@orygin-ai/dsh-acp-demo'
        config:
          provider: orygin-official
          model: orygin-v4-flash
          persistenceRoot: !!js process.env.ORYGIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@orygin-ai/dsh-llm-replay'
            config:
              providers:
                - id: orygin-official
                  name: Orygin
                  models:
                    - id: orygin-v4-flash
                    - id: orygin-v4-pro
