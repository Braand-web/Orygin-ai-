# Keyless replay counterpart to fs-diff-bound.cordis.yml. Replay patches apply
# directly against the live cordis.yml because include patches cannot target
# entries behind a nested include; the acp-agent restatement keeps the recorded
# orygin-v4-flash model and raw JSONL persistence for the harness's harvest.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-orygin
        name: '@orygin-ai/dsh-llm-orygin'
        disabled: true
      - id: acp-agent
        name: '@orygin-ai/dsh-acp-demo'
        config:
          provider: orygin-official
          model: orygin-v4-flash
          persistenceRoot: !!js process.env.ORYGIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: fs-sandbox
        name: '@orygin-ai/dsh-fs-sandbox'
        config:
          cwd: !!js process.cwd()
          diffBasisMaxBytes: 64
      - insert:
          - id: llm-replay
            name: '@orygin-ai/dsh-llm-replay'
            config:
              providers:
                - id: orygin-official
                  name: Orygin
                  models:
                    # Capability parity with the live adapter so replay
                    # reconstructs the freshly recorded request header.
                    - id: orygin-v4-flash
                      contextWindow: 1000000
                      defaultMaxTokens: 256000
                      reasoningEfforts: ['off', 'low', 'high', 'max']
                      defaultReasoningEffort: max
                    - id: orygin-v4-pro
