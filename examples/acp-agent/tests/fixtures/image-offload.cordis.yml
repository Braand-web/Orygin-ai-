# Keyless assembled-request snapshot for native Orygin image offload. The
# local provider endpoint is supplied by the snapshot test; the real attachment
# store and ACP bridge carry two uploaded images into one model request.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-orygin
        name: '@orygin-ai/dsh-llm-orygin'
        config:
          apiKeyEnv: ORYGIN_SNAPSHOT_API_KEY
          baseURL: !!js process.env.ORYGIN_SNAPSHOT_BASE_URL
          thinking: disabled
          maxRequestFilesBytes: 92
          imageOffloadByteQuantum: 1
          models:
            - id: orygin-v4-flash-vision-exp
              contextWindow: 32768
              maxTokens: 1024
              inputModalities: [text, image]
      - id: acp-agent
        name: '@orygin-ai/dsh-acp-demo'
        config:
          provider: orygin-official
          model: orygin-v4-flash-vision-exp
          persistenceRoot: !!js process.env.ORYGIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@orygin-ai/dsh-attachment-local'
