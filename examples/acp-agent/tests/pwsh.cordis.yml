# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-orygin
  name: '@orygin-ai/dsh-llm-orygin'
  config:
    models:
      - id: orygin-v4-pro

- id: subprocess
  name: '@orygin-ai/dsh-subprocess-local'

- id: bash
  name: '@orygin-ai/dsh-pwsh-local'

- id: shell-env
  name: '@orygin-ai/dsh-shell-env'

- id: acp-agent
  name: '@orygin-ai/dsh-acp-demo'
  config:
    provider: orygin-official
    model: orygin-v4-pro
    persistenceRoot: !!js process.env.ORYGIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.ORYGIN_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@orygin-ai/dsh-tool-pwsh'
