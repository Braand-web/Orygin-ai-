# Workspace-context snapshot overlay: keep project-root and user-global
# discovery inside the scenario's temporary cwd. The app config patch replaces
# the whole base config, so the base fields are restated verbatim.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@orygin-ai/dsh-acp-demo'
        config:
          provider: orygin-official
          model: orygin-v4-pro
          persistenceRoot: !!js process.env.ORYGIN_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.ORYGIN_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
            dshHome: !!js process.cwd() + '/.dsh'
            projectRootMarkers:
              - .dsh-project
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
