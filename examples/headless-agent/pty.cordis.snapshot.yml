# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@orygin-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-orygin
        name: '@orygin-ai/dsh-llm-orygin'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@orygin-ai/dsh-sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@orygin-ai/dsh-terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@orygin-ai/dsh-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@orygin-ai/dsh-llm-replay'
